name: Feature request
description: Suggest a feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
