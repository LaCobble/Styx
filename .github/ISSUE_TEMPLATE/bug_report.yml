name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run…
        2. Click…
        3. See…
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and language/runtime version.
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste a screenshot or a log excerpt. Remove any personal data.
